<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/quo-captain.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quo-Captain · Somec</title>
    <script>
      // Theme and text size before first paint (no light flash). Large text is the default for presentations.
      try {
        const theme = localStorage.getItem('somec.theme');
        document.documentElement.dataset.theme = theme === 'dark' || theme === 'light' ? theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.text = localStorage.getItem('somec.text') === 'normal' ? 'normal' : 'large';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
